apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-api
  template:
    metadata:
      labels:
        app: portfolio-api
        tags.datadoghq.com/service: portfolio-api
        tags.datadoghq.com/env: portfolio
      annotations:
        ad.datadoghq.com/api.logs: '[{"source":"python","service":"portfolio-api"}]'
        ad.datadoghq.com/api.checks: |
          {"openmetrics":{"init_config":{},"instances":[{
            "openmetrics_endpoint":"http://%%host%%:8080/metrics",
            "namespace":"portfolio",
            "metrics":[{"portfolio_http_requests":"requests"}],
            "tags":["service:portfolio-api","env:portfolio"]
          }]}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: portfolio-api:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-api
spec:
  selector:
    app: portfolio-api
  ports:
    - port: 8080
      targetPort: http
