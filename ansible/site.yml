---
- name: Configure the Ubuntu Kubernetes host
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Require an explicit K3s release
      ansible.builtin.assert:
        that:
          - k3s_version is defined
          - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')

    - name: Apply Ubuntu package updates
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Configure K3s without public ingress components
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          disable:
            - traefik
            - servicelb
          write-kubeconfig-mode: "0600"
          secrets-encryption: true
      notify: Restart K3s

    - name: Fetch the official installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/sbin/install-k3s
        mode: "0700"

    - name: Check for the K3s binary
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Read installed version
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: installed
      changed_when: false
      when: k3s_binary.stat.exists

    - name: Install or update K3s
      ansible.builtin.command: /usr/local/sbin/install-k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      when: k3s_version not in (installed.stdout | default('')).split()

    - name: Enable and start K3s
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: started

  handlers:
    - name: Restart K3s
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
